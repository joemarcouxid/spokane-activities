name: "📣 Submit an event tip"
description: Saw a food truck post, flyer, or Facebook event? Add it to the app.
title: "[Tip] "
body:
  - type: input
    attributes:
      label: What's happening?
      placeholder: "e.g. Taco truck at Kendall Yards Night Market"
    validations:
      required: true
  - type: input
    attributes:
      label: Date
      placeholder: "2026-11-21  or  11/21/2026"
    validations:
      required: true
  - type: input
    attributes:
      label: Start time
      placeholder: "5:00 PM (leave blank for all day)"
  - type: input
    attributes:
      label: End time
      placeholder: "8:00 PM"
  - type: input
    attributes:
      label: Where (venue or address)
      placeholder: "Kendall Yards, 1335 W Summit Pkwy"
  - type: dropdown
    attributes:
      label: Town
      options: [Spokane, Spokane Valley, Liberty Lake, "North / Mead / Deer Park", "Airway Heights / West Plains", Cheney, "Coeur d'Alene / Post Falls"]
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Kind of event
      options: [Food truck, Music, Family, Outdoors, Arts, Market, Festival, Sports, Other]
  - type: input
    attributes:
      label: Cost
      placeholder: "Free, $15, etc."
  - type: input
    attributes:
      label: Link
      placeholder: "Facebook post, flyer, or website"
  - type: textarea
    attributes:
      label: Details
